provider: ollama          # ollama | anthropic | openai
model: llama3.1:8b        # ollama: llama3.1:8b | anthropic: claude-sonnet-4-6 | openai: gpt-4o
embedding_model: nomic-embed-text   # ollama only; anthropic/openai use their own

ollama_base_url: http://localhost:11434
num_ctx: 16384            # ollama context window; its 4096 default silently truncates resolution prompts
request_timeout: 600       # seconds; local 8B models need minutes for large resolution prompts

# Confidence thresholds for entity resolution
confidence:
  auto_commit: 0.85       # above this → committed to graph automatically
  needs_review: 0.50      # between this and auto_commit → committed but flagged
  reject: 0.50            # below this → not committed, surfaced as unresolved

# Document chunking
chunking:
  chunk_size: 800         # characters
  overlap: 150            # characters

# Neo4j vector index
vector:
  dimensions: 768         # nomic-embed-text = 768; change if using a different model
  similarity: cosine

# Ingestion pipeline
ingest:
  review_gate: false      # true → pause before writing to Neo4j when entities need review (resume via POST /ingest/review)
